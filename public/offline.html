<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OLLIN – Offline</title>
  <style>
    :root {
      --bg: #f5f7f4;
      --card: #ffffff;
      --muted: #667085;
      --ink: #1f2937;
      --line: #e5e7eb;
      --brand: #1f7a45;
      --brand-soft: #ebf7f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
    }
    .card {
      width: min(92vw, 360px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }
    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: var(--brand-soft);
      display: grid;
      place-items: center;
      border: 1px solid rgba(31, 122, 69, 0.1);
    }
    .icon svg {
      width: 34px;
      height: 34px;
      stroke: var(--brand);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 { font-size: 1.1rem; margin: 0 0 10px; }
    p { font-size: 0.88rem; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: white;
      padding: 11px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { filter: brightness(0.97); }
    button:disabled { filter: brightness(0.97); cursor: default; }
    .status {
      margin: 12px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.1em;
    }
    .status.busy { color: var(--brand); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M8 18h8a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.7 1.5A3.5 3.5 0 0 0 8 18Z"/>
        <path d="M12 8v6"/>
        <path d="m9.5 13.5 2.5 2.5 2.5-2.5"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>OLLIN needs a connection to load quizzes and save results. Check your internet and try again.</p>
    <button id="retry" type="button">Retry</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <script>
    (function () {
      var button = document.getElementById("retry");
      var status = document.getElementById("status");
      // A reload takes this page away, so the last attempt is remembered and
      // reported here when the retry lands back on it still offline.
      var KEY = "ollin-offline-retry";

      function say(text, busy) {
        status.textContent = text;
        status.className = "status" + (busy ? " busy" : "");
      }

      function reloadAfter(text) {
        say(text, true);
        button.disabled = true;
        button.textContent = "Retrying…";
        try { sessionStorage.setItem(KEY, "1"); } catch (e) { /* storage blocked */ }
        // Let the state paint before the navigation replaces the page.
        setTimeout(function () { location.reload(); }, 400);
      }

      try {
        if (sessionStorage.getItem(KEY) === "1") {
          sessionStorage.removeItem(KEY);
          say(navigator.onLine ? "Still loading — the connection may be slow." : "Still offline — check your internet and retry.", false);
        }
      } catch (e) { /* storage blocked */ }

      button.addEventListener("click", function () {
        if (navigator.onLine === false) {
          reloadAfter("Still offline — trying again…");
        } else {
          reloadAfter("Trying again…");
        }
      });

      // Back online: no need to press anything.
      window.addEventListener("online", function () {
        say("You're back online — reloading…", true);
        button.disabled = true;
        try { sessionStorage.removeItem(KEY); } catch (e) { /* storage blocked */ }
        location.reload();
      });
    })();
  </script>
</body>
</html>
