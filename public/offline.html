<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OLLIN – Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 32px;
      max-width: 340px;
      text-align: center;
    }
    .dot { width: 40px; height: 40px; border-radius: 8px; background: #006633; margin: 0 auto 16px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; color: #666; margin: 0 0 16px; line-height: 1.5; }
    button {
      background: #006633; color: #fff; border: 0; border-radius: 6px;
      padding: 10px 20px; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>You're offline</h1>
    <p>OLLIN needs a connection to load quizzes and save your results. Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
