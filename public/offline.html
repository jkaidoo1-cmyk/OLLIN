<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OLLIN – Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
      padding: 32px;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dot { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #43A047 0%, #5CB85C 100%); margin: 0 auto 16px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; color: #666; margin: 0 0 16px; line-height: 1.5; }
    button {
      background: linear-gradient(135deg, #43A047 0%, #5CB85C 100%); color: #fff; border: 0; border-radius: 10px;
      padding: 10px 20px; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(67, 160, 71, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>You're offline</h1>
    <p>OLLIN needs a connection to load quizzes and save your results. Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
